name: Scheduled Auto Test & Feishu Notify

on:
  # 定时触发（UTC时间）
  schedule:
    # 每周1、3、5北京时间上午9点执行 (UTC+8，所以UTC是1点)
    - cron: '0 1 * * 1,3,5'
    # 每周一三五下午6点执行
    # - cron: '0 10 * * 1,3,5'

  # 保留手动触发入口，方便调试
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tests & Generate report
        run: |
          pytest tests/ --alluredir=./allure-results || true
        continue-on-error: true

      - name: Send results to Feishu
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python scripts/send_feishu.py