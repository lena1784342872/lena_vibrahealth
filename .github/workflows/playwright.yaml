name: Playwright UI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # ✅ 新增：定时触发（北京时间每天9点 = UTC 1点）
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Test scope (p0 / full)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - p0

jobs:
  test:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.40.0
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest pymysql sshtunnel paramiko

      - name: Run tests
        run: |
          # ✅ 统一测试策略：定时任务默认跑 full，手动可选 p0
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.test_scope }}" == "p0" ]]; then
            echo "Running P0 tests..."
            pytest -m p0 -v --junitxml=report.xml --alluredir=allure-results
          else
            echo "Running full regression..."
            pytest -v --junitxml=report.xml --alluredir=allure-results
          fi
        env:
          HEADLESS: true
          SLOW_MO: 0
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

      # ✅ 先部署再通知，确保飞书中的链接是最新的
      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          personal_token: ${{ secrets.PAT_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: .
          keep_files: false

      - name: Send Feishu Notification
        if: always()
        run: |
          if [ ! -f report.xml ]; then
            echo "report.xml not found, skipping notification"
            exit 0
          fi
          REPORT_URL="https://lena1784342872.github.io/lena_vibrahealth/"
          python feishu_notifier.py --report=report.xml \
            --webhook="${{ secrets.FEISHU_WEBHOOK }}" \
            --secret="${{ secrets.FEISHU_SECRET }}" \
            --report-url="$REPORT_URL"
        shell: bash