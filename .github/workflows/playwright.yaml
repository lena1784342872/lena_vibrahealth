name: Playwright UI Tests

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

  schedule:
    - cron: '0 2 * * 1,3,5'
      timezone: 'Asia/Shanghai'

  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Test scope (p0 / full)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - p0

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    container: mcr.microsoft.com/playwright/python:v1.40.0

    timeout-minutes: 30

    concurrency:
      group: playwright-ui-tests-${{ github.ref }}
      cancel-in-progress: false

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run tests
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.test_scope }}" == "p0" ]]; then
            echo "Running P0 tests..."
            pytest -m p0 -v \
              --junitxml=report.xml \
              --alluredir=allure-results
          else
            echo "Running full regression..."
            pytest -v \
              --junitxml=report.xml \
              --alluredir=allure-results
          fi
        env:
          HEADLESS: true
          SLOW_MO: 0
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}

      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: reports/${{ github.run_id }}
          keep_files: true

      - name: Send Feishu Notification
        if: always()
        run: |
          if [ ! -f report.xml ]; then
            echo "report.xml not found, skipping notification"
            exit 0
          fi

          REPORT_URL="https://lena1784342872.github.io/lena_vibrahealth/reports/${{ github.run_id }}/"

          python feishu_notifier.py \
            --report=report.xml \
            --webhook="${{ secrets.FEISHU_WEBHOOK }}" \
            --secret="${{ secrets.FEISHU_SECRET }}" \
            --report-url="$REPORT_URL"

        shell: bash